{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:420px">
  <div class="card border-0 shadow-sm p-4">
    <h1 class="h5 fw-bold">Reset password</h1>
    <p class="text-muted small">
      Enter the email associated with your account. We will send a secure reset link
      (or show it on-screen when email is not configured).
    </p>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" required autocomplete="email">
      </div>
      <button class="btn btn-success w-100" type="submit">Send reset link</button>
    </form>
    <a class="small d-block mt-3" href="{{ url_for('auth.login') }}">Back to login</a>
  </div>
</div>
{% endblock %}
