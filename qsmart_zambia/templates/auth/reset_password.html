{% extends "base.html" %}
{% block title %}Set new password – QSMART Zambia{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:420px">
  <div class="card border-0 shadow-sm p-4">
    <h1 class="h5 fw-bold">Set new password</h1>
    <p class="text-muted small">Choose a strong password for your QSMART Zambia account.</p>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">New password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" name="password" required minlength="8"
                 autocomplete="new-password">
          <button class="btn btn-outline-secondary" type="button" data-toggle-password="password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <div class="form-text">At least 8 characters.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm password</label>
        <input type="password" class="form-control" name="confirm_password" required minlength="8"
               autocomplete="new-password">
      </div>
      <button class="btn btn-success w-100" type="submit">Update password</button>
    </form>
    <a class="small d-block mt-3" href="{{ url_for('auth.login') }}">Back to login</a>
  </div>
</div>
{% endblock %}
