{% extends "base.html" %}
{% block title %}Create admin{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:480px">
  <h1 class="h4">Create administrator</h1>
  <p class="text-muted">Slots left: <strong>{{ slots }}</strong> of {{ max_n }} (backend limit).</p>
  {% if slots <= 0 %}
  <div class="alert alert-warning">Maximum administrators reached.</div>
  {% else %}
  <form method="POST" class="card border-0 shadow-sm p-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Full name</label><input class="form-control" name="full_name"></div>
    <div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" required></div>
    <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" name="email" required></div>
    <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" name="password" required minlength="8"></div>
    <button class="btn btn-success">Create</button>
  </form>
  {% endif %}
</div>
{% endblock %}
