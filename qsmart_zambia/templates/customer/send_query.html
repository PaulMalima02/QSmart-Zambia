{% extends "base.html" %}
{% block title %}Send query – QSMART Zambia{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:560px">
  <h1 class="h4">Send a query</h1>
  <p class="text-muted small">Type a message, tap the mic to record a voice note, or attach a photo/document.</p>
  <form method="POST" enctype="multipart/form-data" data-voice-composer class="card border-0 shadow-sm p-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">Institution *</label>
      <select name="institution_id" class="form-select" required>
        <option value="">— Select —</option>
        {% for i in institutions %}
        <option value="{{ i.id }}">{{ i.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Language you prefer *</label>
      <select name="language" class="form-select" required>
        {% for code, label in languages %}
        <option value="{{ code }}" {% if current_user.preferred_language==code %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Subject</label>
      <input class="form-control" name="subject" maxlength="150">
    </div>

    <label class="form-label">Message</label>
    <div class="query-composer mb-2">
      <textarea class="form-control" name="message" id="messageBox" rows="3"
                placeholder="Type your message…"></textarea>
      <div class="query-composer-toolbar">
        <label class="attach-btn mb-0" title="Attach photo or document">
          <i class="bi bi-paperclip"></i>
          <input type="file" name="attachment" id="attachFile" class="d-none"
                 accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt">
        </label>
        <button type="button" class="mic-btn" id="micBtn" title="Hold / tap to record voice note">
          <i class="bi bi-mic-fill"></i>
        </button>
        <span class="rec-status" id="recStatus"></span>
      </div>
      <input type="file" name="voice_note" id="voiceFile" class="d-none" accept="audio/*">
    </div>
    <div class="small text-muted mb-3" id="attachLabel"></div>

    <button class="btn btn-success" type="submit">Submit query</button>
    <a href="{{ url_for('customer.dashboard') }}" class="btn btn-link">Cancel</a>
  </form>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/voice.js') }}"></script>
<script>
document.getElementById('attachFile')?.addEventListener('change', function() {
  const el = document.getElementById('attachLabel');
  if (el) el.textContent = this.files[0] ? 'Attached: ' + this.files[0].name : '';
});
</script>
{% endblock %}
