# QSMART Zambia — Render Blueprint
# Deploy: Render Dashboard → New → Blueprint → connect this repo
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: qsmart-zambia
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: FORCE_HTTPS
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@qsmart.zm
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMS_PROVIDER
        value: log
      - key: SMS_API_KEY
        sync: false
      - key: SMS_USERNAME
        value: sandbox
      - key: SMS_SENDER
        value: QSMART
      - key: EMAIL_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_DEFAULT_SENDER
        value: "QSMART Zambia <noreply@qsmart.zm>"
      - key: OTP_EXPIRY_MINUTES
        value: "5"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: qsmart-db
          property: connectionString

databases:
  - name: qsmart-db
    plan: free
    databaseName: qsmart
    user: qsmart
    region: frankfurt
